<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuvero AI: Instagram Carousel Studio & Rendering Engine</title>
  <meta name="description" content="Production-ready Instagram carousel rendering engine and export suite for Nuvero AI (nuvero.space).">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
  
  <!-- High-Fidelity Rendering Engines (dom-to-image-more for pixel-perfect vector/text + html2canvas fallback) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image-more/3.5.0/dom-to-image-more.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Studio Header -->
  <header class="studio-header">
    <div class="brand-badge">
      <div class="logo-icon">
        <svg viewBox="0 0 1007 983" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd" fill="#C1121F"
            d="M871.000,-0.000 C961.306,-1.478 1032.106,75.180 992.1000,166.000 C975.504,206.632 939.428,228.835 888.1000,237.000 C816.790,248.692 746.791,161.035 768.1000,86.1000 C779.925,50.580 806.306,20.681 839.1000,6.1000 C850.332,4.667 860.668,2.333 871.000,-0.000 ZM240.1000,12.1000 C326.985,16.026 341.399,63.639 374.1000,117.000 C401.664,157.996 428.336,199.004 455.000,239.1000 C614.984,485.975 775.016,732.025 935.000,978.000 C880.005,978.000 824.995,978.000 769.1000,978.000 C744.048,977.1000 712.031,981.000 691.1000,974.000 C623.928,950.211 592.841,870.002 556.1000,813.000 C455.010,654.682 352.990,496.317 250.1000,338.000 C250.667,338.000 250.333,338.000 249.1000,338.000 C249.1000,484.985 249.1000,632.015 249.1000,779.000 C250.004,835.537 263.308,919.465 236.000,954.1000 C227.924,965.509 211.872,974.645 197.000,978.000 C163.542,985.548 56.150,983.098 35.000,970.000 C-13.413,940.019 3.996,832.765 3.1000,760.000 C3.1000,586.684 3.1000,413.316 3.1000,239.1000 C3.998,186.013 -8.264,72.039 14.1000,39.1000 C42.545,2.064 129.712,13.997 194.000,13.1000 C209.665,13.667 225.335,13.333 240.1000,12.1000 ZM868.1000,284.000 C914.759,283.487 973.401,279.884 992.1000,306.000 C1015.415,335.869 1003.004,432.762 1002.1000,480.1000 C1002.1000,631.985 1002.1000,783.015 1002.1000,933.1000 C1001.667,933.000 1000.333,931.1000 999.000,931.000 C920.675,810.012 842.325,688.988 764.000,567.1000 C764.000,547.669 764.000,527.331 764.000,506.1000 C764.001,459.463 753.594,328.717 775.000,304.1000 C789.666,288.751 811.779,289.643 839.000,285.000 C848.999,284.667 859.001,284.333 868.1000,284.000 Z"/>
        </svg>
      </div>
      <div class="brand-title">
        <div class="name">
          <span>NUVERO AI</span>
          <span class="tag">STUDIO v4.0</span>
        </div>
        <div class="sub">Instagram Post Rendering Engine (nuvero.space)</div>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn btn-secondary" id="exportCurrentBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export Slide PNG (2x Retina)
      </button>
      <button class="btn btn-primary" id="exportAllBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Batch Export All Slides (PNG)
      </button>
    </div>
  </header>

  <!-- Main Application Body -->
  <main class="studio-main">
    
    <!-- Left Configuration Sidebar -->
    <aside class="studio-sidebar">
      
      <!-- Post Selection Section -->
      <div class="sidebar-section">
        <div class="sidebar-title">
          <span>Nuvero Post Library</span>
          <span class="badge" id="postCountBadge">9 Posts</span>
        </div>
        <div class="post-list" id="postListContainer">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Format & Dimensions Section -->
      <div class="sidebar-section">
        <div class="sidebar-title">
          <span>Aspect Ratio & Dimensions</span>
        </div>
        <div class="control-grid">
          <button class="toggle-btn active" id="ratio45Btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/></svg>
            <span>4:5 Portrait</span>
            <span style="font-size: 9px; opacity: 0.7;">1080 × 1350 px</span>
          </button>
          <button class="toggle-btn" id="ratio11Btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
            <span>1:1 Square</span>
            <span style="font-size: 9px; opacity: 0.7;">1080 × 1080 px</span>
          </button>
        </div>
      </div>

      <!-- Color Theme Section -->
      <div class="sidebar-section">
        <div class="sidebar-title">
          <span>Brand Surface Variant</span>
        </div>
        <div class="control-grid">
          <button class="toggle-btn" id="themeTanBtn">
            <div style="width: 14px; height: 14px; border-radius: 50%; background: #FDF0D5; border: 1.5px solid #003049;"></div>
            <span>Signature Tan</span>
            <span style="font-size: 9px; opacity: 0.7;">#FDF0D5 Canvas</span>
          </button>
          <button class="toggle-btn active" id="themeDarkBtn">
            <div style="width: 14px; height: 14px; border-radius: 50%; background: #003049; border: 1.5px solid #FDF0D5;"></div>
            <span>Industrial Navy</span>
            <span style="font-size: 9px; opacity: 0.7;">#003049 Canvas</span>
          </button>
        </div>
      </div>

      <!-- Caption & Copywriting Assistant -->
      <div class="sidebar-section" style="border-bottom: none;">
        <div class="sidebar-title">
          <span>Instagram Caption</span>
          <span style="color: #22c55e; font-size: 9.5px;">✓ Zero Em Dashes</span>
        </div>
        <div class="caption-box" id="captionContent">
          <!-- Populated by JS -->
        </div>
        <div class="char-counter">
          <span id="captionCharCount">0 characters</span>
          <button class="btn btn-secondary" id="copyCaptionBtn" style="padding: 4px 10px; font-size: 10px;">
            Copy Caption
          </button>
        </div>
      </div>

    </aside>

    <!-- Center Workspace / Rendering Canvas Area -->
    <section class="studio-canvas-area">
      
      <!-- Canvas Control Toolbar -->
      <div class="canvas-toolbar">
        <div class="slide-nav-group">
          <button class="icon-btn" id="prevSlideBtn" title="Previous Slide (Left Arrow)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          
          <div class="slide-pill-nav" id="slidePillNav">
            <!-- Dynamically populated by JS -->
          </div>

          <button class="icon-btn" id="nextSlideBtn" title="Next Slide (Right Arrow)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>

        <div class="view-mode-toggle">
          <button class="icon-btn active" id="viewSingleBtn" title="Single Slide Focus">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
          </button>
          <button class="icon-btn" id="viewGridBtn" title="Storyboard Grid (All 4 Slides)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          </button>
        </div>
      </div>

      <!-- Canvas Stage -->
      <div class="canvas-stage" id="canvasStage">
        <!-- Rendered by JS -->
      </div>

    </section>

  </main>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
